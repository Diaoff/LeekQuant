[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# This URL is overridden at runtime by alembic/env.py (uses Settings.database_url).
# No real credentials are stored here. Set DATABASE_URL in .env or environment.
sqlalchemy.url = postgresql+asyncpg://leek_user:UNCONFIGURED@localhost:5432/leek_quant

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S


services:
  postgres:
    image: ${IMAGE_PREFIX:-}postgres:15-alpine
    container_name: leek-quant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-leek_quant}
      POSTGRES_USER: ${POSTGRES_USER:-leek_user}
      # POSTGRES_PASSWORD is required — no default. Set in .env or environment.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      TZ: ${TZ:-Asia/Shanghai}
    command: ["postgres", "-c", "max_connections=120"]
    ports:
      - "${POSTGRES_PORT:-127.0.0.1:5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
    networks:
      - leek-quant-network

  redis:
    image: ${IMAGE_PREFIX:-}redis:7-alpine
    container_name: leek-quant-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-lru", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-127.0.0.1:6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    networks:
      - leek-quant-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${IMAGE_PREFIX:-}python:3.12-slim-bookworm
        BUILD_REGION: ${BUILD_REGION:-cn}
        RUNTIME_IMAGE: ${IMAGE_PREFIX:-}python:3.12-slim-bookworm
        RUNTIME_REGION: ${BUILD_REGION:-cn}
    container_name: leek-quant-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DATABASE_URL: ${CONTAINER_DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-leek_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-leek_quant}}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${BACKEND_PORT:-127.0.0.1:8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    networks:
      - leek-quant-network

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${IMAGE_PREFIX:-}python:3.12-slim-bookworm
        BUILD_REGION: ${BUILD_REGION:-cn}
        RUNTIME_IMAGE: ${IMAGE_PREFIX:-}python:3.12-slim-bookworm
        RUNTIME_REGION: ${BUILD_REGION:-cn}
    container_name: leek-quant-celery-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DATABASE_URL: ${CONTAINER_DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-leek_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-leek_quant}}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}
      TZ: ${TZ:-Asia/Shanghai}
    command: ["celery", "-A", "app.tasks.celery_app:celery_app", "worker", "--loglevel=INFO", "-Q", "default,data,backtest,factor,trading"]
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
    networks:
      - leek-quant-network

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${IMAGE_PREFIX:-}python:3.12-slim-bookworm
        BUILD_REGION: ${BUILD_REGION:-cn}
        RUNTIME_IMAGE: ${IMAGE_PREFIX:-}python:3.12-slim-bookworm
        RUNTIME_REGION: ${BUILD_REGION:-cn}
    container_name: leek-quant-celery-beat
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DATABASE_URL: ${CONTAINER_DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-leek_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-leek_quant}}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}
      TZ: ${TZ:-Asia/Shanghai}
    command: ["celery", "-A", "app.tasks.celery_app:celery_app", "beat", "--loglevel=INFO"]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    networks:
      - leek-quant-network

  realtime_risk_guard:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${IMAGE_PREFIX:-}python:3.12-slim-bookworm
        BUILD_REGION: ${BUILD_REGION:-cn}
        RUNTIME_IMAGE: ${IMAGE_PREFIX:-}python:3.12-slim-bookworm
        RUNTIME_REGION: ${BUILD_REGION:-cn}
    container_name: leek-quant-realtime-risk-guard
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DATABASE_URL: ${CONTAINER_DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-leek_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-leek_quant}}
      TZ: ${TZ:-Asia/Shanghai}
    command: ["python", "-m", "app.realtime.risk_guard", "--mode", "${REALTIME_RISK_GUARD_MODE:-snapshot}", "--refresh-interval", "${REALTIME_RISK_GUARD_INTERVAL:-15}"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, redis; r = redis.from_url(os.environ['REDIS_URL']); print('ok' if r.ping() else 'fail')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    networks:
      - leek-quant-network

  realtime_ws:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${IMAGE_PREFIX:-}python:3.12-slim-bookworm
        BUILD_REGION: ${BUILD_REGION:-cn}
        RUNTIME_IMAGE: ${IMAGE_PREFIX:-}python:3.12-slim-bookworm
        RUNTIME_REGION: ${BUILD_REGION:-cn}
    container_name: leek-quant-realtime-ws
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DATABASE_URL: ${CONTAINER_DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-leek_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-leek_quant}}
      TZ: ${TZ:-Asia/Shanghai}
    command: ["python", "-m", "app.realtime.ws_producer", "--dynamic", "--reload-interval", "${WS_RELOAD_INTERVAL:-300}"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, redis; r = redis.from_url(os.environ['REDIS_URL']); print('ok' if r.ping() else 'fail')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    networks:
      - leek-quant-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20-alpine}
        RUNTIME_IMAGE: ${IMAGE_PREFIX:-}nginx:1.25-alpine
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: leek-quant-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    networks:
      - leek-quant-network

networks:
  leek-quant-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
